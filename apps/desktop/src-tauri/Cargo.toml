[package]
name = "browserail-desktop"
version = "0.1.0"
description = "External bookmark panels for browser windows"
authors = ["melon.masou"]
edition = "2024"

[lib]
name = "browserail_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Size-optimized
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
futures-util = "0.3"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tokio-tungstenite = "0.30"
urlencoding = "2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
tauri-runtime-wry = { git = "https://github.com/melon-masou/tauri", rev = "9ec6d48d48ffb5cf484a7e1e3fffcaf70d7ed35d" }
wry = { git = "https://github.com/melon-masou/wry", rev = "877bf02bc21a972ac6edc115febbcab32ade0ee0" }
