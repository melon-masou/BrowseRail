name: Release

on:
  push:
    branches: [release]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0 or v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Compute release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $raw = "${{ github.event.inputs.version }}".Trim().TrimStart("v")
            $release = $raw
            $manifest = $raw
          } elseif ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME) {
            $raw = $env:GITHUB_REF_NAME.Trim().TrimStart("v")
            $release = $raw
            $manifest = $raw
          } else {
            $dt = (Get-Date).ToUniversalTime()
            # Version YY.(month*100+day).(hour*100+minute), e.g. 2026-09-01 13:01 UTC -> 26.901.1301.
            # Chrome requires each component <= 65535; casting to int drops the leading zeros.
            $version = "{0}.{1}.{2}" -f [int]$dt.ToString("yy"), [int]$dt.ToString("MMdd"), [int]$dt.ToString("HHmm")
            $release = $version
            $manifest = $version
          }
          "version=$release" >> $env:GITHUB_OUTPUT
          "manifest_version=$manifest" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exe and extensions
        shell: pwsh
        run: |
          $env:BROWSERAIL_RELEASE_TAG = "v${{ steps.version.outputs.version }}"
          pnpm build:release "${{ steps.version.outputs.manifest_version }}"

      - name: Package release assets
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path build/desktop/BrowseRail.exe -DestinationPath "release-assets/BrowseRail-$v.zip"
          Compress-Archive -Path build/extension/chrome/* -DestinationPath "release-assets/BrowseRail-chrome-$v.zip"
          Compress-Archive -Path build/extension/firefox/* -DestinationPath "release-assets/BrowseRail-firefox-$v.zip"

      - name: Create draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: v${{ steps.version.outputs.version }}
          name: BrowseRail ${{ steps.version.outputs.version }}
          files: |
            release-assets/BrowseRail-${{ steps.version.outputs.version }}.zip
            release-assets/BrowseRail-chrome-${{ steps.version.outputs.version }}.zip
            release-assets/BrowseRail-firefox-${{ steps.version.outputs.version }}.zip
